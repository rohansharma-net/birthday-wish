<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Gauri! ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    :root {
      --bg-color: #fdf0ed;
      --card-bg: #ffffff;
      --primary: #ff8fa3;
      --primary-hover: #ff758f;
      --text-main: #4a4e69;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Quicksand', sans-serif; 
      background-color: var(--bg-color); 
      color: var(--text-main); 
      min-height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      padding: 20px;
      overflow-x: hidden;
    }

    /* Fullscreen Entrance Overlay */
    .entrance-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--bg-color);
      z-index: 999;
      pointer-events: none;
      transition: opacity 1.2s ease, visibility 1.2s ease;
    }
    .entrance-overlay.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    /* Floating Decorations */
    .decoration {
      position: fixed;
      cursor: pointer;
      user-select: none;
      animation: floatUp linear infinite;
      z-index: 1;
      transition: transform 0.15s ease-out, opacity 0.15s ease-out;
    }
    .balloon {
      width: 42px;
      height: 52px;
      background-color: #ffb3c1;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      box-shadow: inset -5px -5px 10px rgba(0,0,0,0.08);
      display: flex;
      justify-content: center;
    }
    .balloon::after {
      content: '';
      position: absolute;
      bottom: -8px;
      width: 2px;
      height: 40px;
      background: rgba(0,0,0,0.15);
    }
    .heart {
      font-size: 1.6rem;
      filter: drop-shadow(0 4px 6px rgba(255, 143, 163, 0.3));
    }
    @keyframes floatUp {
      0% { transform: translateY(110vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-20vh) rotate(20deg); opacity: 0; }
    }
    .popped {
      transform: scale(1.6) !important;
      opacity: 0 !important;
    }

    /* Main Card */
    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      border-radius: 28px;
      padding: 40px 25px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(255, 143, 163, 0.18);
      z-index: 10;
      position: relative;
      opacity: 0;
      transform: translateY(20px);
      animation: revealCard 1s ease forwards 1.8s;
    }
    @keyframes revealCard {
      to { opacity: 1; transform: translateY(0); }
    }
    
    h1 { font-family: 'Fredoka', sans-serif; font-size: 2.5rem; color: var(--primary); margin-bottom: 20px; }

    /* Interactive Cake & Wind Effect */
    .cake-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 25px 0 15px 0;
      position: relative;
    }
    .candle {
      width: 12px;
      height: 38px;
      background: #ffebb3;
      border-radius: 4px;
      position: relative;
      z-index: 2;
    }
    .flame {
      width: 16px;
      height: 24px;
      background: #ffb703;
      border-radius: 50% 50% 20% 20%;
      position: absolute;
      top: -26px;
      left: -2px;
      box-shadow: 0 0 15px #ffb703, 0 0 30px #fb8500;
      animation: flicker 1s infinite alternate;
      transition: opacity 0.5s ease-out;
    }
    @keyframes flicker {
      0% { transform: scale(1) rotate(-2deg); opacity: 0.9; }
      100% { transform: scale(1.1) rotate(2deg); opacity: 1; }
    }
    .smoke {
      width: 8px;
      height: 8px;
      background: rgba(180, 180, 180, 0.6);
      border-radius: 50%;
      position: absolute;
      top: -20px; left: 2px;
      opacity: 0;
      pointer-events: none;
    }
    .smoke.active {
      animation: smokeRise 1.5s ease-out forwards;
    }
    @keyframes smokeRise {
      0% { opacity: 0.8; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-30px) scale(2.5); filter: blur(3px); }
    }

    /* Gust of Wind Particles */
    .wind-gust {
      position: absolute;
      font-size: 1.8rem;
      pointer-events: none;
      opacity: 0;
      z-index: 20;
    }
    .wind-gust.active {
      animation: windSweep 0.8s ease-out forwards;
    }
    @keyframes windSweep {
      0% { opacity: 0; transform: translateX(-80px) translateY(10px) scale(0.6); }
      50% { opacity: 1; }
      100% { opacity: 0; transform: translateX(80px) translateY(-20px) scale(1.3); }
    }

    .cake-top {
      width: 120px;
      height: 40px;
      background: #ffc2d1;
      border-radius: 10px 10px 0 0;
      margin-top: -5px;
      position: relative;
      z-index: 1;
    }
    .cake-top::after {
      content: ''; position: absolute; bottom: -10px; left: 0; width: 100%; height: 20px;
      background: radial-gradient(circle, #fff 10px, transparent 11px) repeat-x;
      background-size: 20px 20px;
    }
    .cake-bottom {
      width: 140px;
      height: 50px;
      background: #ffe5ec;
      border-radius: 5px;
    }

    /* Blow Candles Button */
    .blow-btn {
      background: #fff0f3;
      color: var(--primary);
      border: 2px solid var(--primary);
      padding: 10px 22px;
      border-radius: 50px;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 15px;
      transition: all 0.3s;
    }
    .blow-btn:hover {
      background: var(--primary);
      color: white;
    }

    /* Countdown */
    .countdown-box { margin-top: 25px; margin-bottom: 25px; }
    .countdown-title { font-size: 0.85rem; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 1.5px; }
    .timer { font-family: 'Fredoka', sans-serif; font-size: 1.5rem; color: var(--text-main); margin-top: 5px; }

    /* Next Page Button */
    .btn {
      background-color: var(--primary); color: white; padding: 14px 28px; border-radius: 50px; text-decoration: none; display: inline-block; transition: 0.3s; border: none; font-family: 'Fredoka', sans-serif; font-size: 1.05rem; box-shadow: 0 4px 15px rgba(255, 143, 163, 0.4);
    }
    .btn:hover { background-color: var(--primary-hover); transform: translateY(-3px); }
  </style>
</head>
<body>

  <!-- Fullscreen Initial Balloons/Hearts Overlay -->
  <div class="entrance-overlay" id="entranceOverlay"></div>

  <!-- Main Content Card -->
  <div class="card">
    <h1>Happy Birthday Gauri! ✨</h1>

    <div class="cake-container">
      <div class="wind-gust" id="windGust">💨💨</div>
      <div class="candle">
        <div class="flame" id="flame"></div>
        <div class="smoke" id="smoke"></div>
      </div>
      <div class="cake-top"></div>
      <div class="cake-bottom"></div>
      <button class="blow-btn" id="blowBtn" onclick="blowCandles()">Blow the Candles 💨</button>
    </div>

    <div class="countdown-box">
      <div class="countdown-title">Countdown to Sept 19 🎈</div>
      <div class="timer" id="countdownTimer">Loading...</div>
    </div>

    <a href="page2.html" class="btn">Open Your Gifts! 🎁 ➔</a>
  </div>

  <script>
    // 1. Countdown Logic
    function updateCountdown() {
      const now = new Date();
      let targetYear = now.getFullYear();
      let targetDate = new Date(`September 19, ${targetYear} 00:00:00`);
      if (now > targetDate) targetDate = new Date(`September 19, ${targetYear + 1} 00:00:00`);

      const diff = targetDate - now;
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / 1000 / 60) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      const timerElement = document.getElementById('countdownTimer');
      if (diff <= 0) { timerElement.textContent = "🎉 IT'S YOUR BIRTHDAY! 🎉"; } 
      else { timerElement.textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`; }
    }
    setInterval(updateCountdown, 1000); updateCountdown();

    // 2. Windy Candle Blow with Glittery Stars
    let isBlown = false;
    function blowCandles() {
      if (isBlown) return;
      isBlown = true;

      const wind = document.getElementById('windGust');
      const flame = document.getElementById('flame');
      const smoke = document.getElementById('smoke');
      const blowBtn = document.getElementById('blowBtn');

      // Trigger windy visual effect
      wind.classList.add('active');

      setTimeout(() => {
        // Extinguish flame & show smoke
        flame.style.opacity = '0';
        smoke.classList.add('active');
        blowBtn.textContent = 'Candles Blown! 🌟';
        blowBtn.style.opacity = '0.7';

        // Trigger glittery stars confetti burst
        const rect = flame.getBoundingClientRect();
        const x = (rect.left + rect.width / 2) / window.innerWidth;
        const y = (rect.top + rect.height / 2) / window.innerHeight;

        confetti({
          particleCount: 100,
          spread: 80,
          origin: { x: x, y: y },
          shapes: ['star'],
          colors: ['#FFD700', '#FFA500', '#FFF', '#FF69B4', '#FFB6C1', '#BDE0FE'],
          scalar: 1.2
        });
      }, 400);
    }

    // 3. Generate Fullscreen Initial Entrance & Floating Side Decorations
    function initBalloonsAndHearts() {
      const colors = ['#ffb3c1', '#c1d3fe', '#bde0fe', '#ffc2d1', '#fcf6bd', '#ff8fa3'];
      const icons = ['💖', '✨', '🌸', '🤍', '⭐'];
      const overlay = document.getElementById('entranceOverlay');

      // Create initial overlay burst covering the whole screen
      for (let i = 0; i < 40; i++) {
        const el = document.createElement('div');
        el.className = 'decoration ' + (Math.random() > 0.4 ? 'balloon' : 'heart');
        if (el.classList.contains('balloon')) {
          el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        } else {
          el.textContent = icons[Math.floor(Math.random() * icons.length)];
        }
        el.style.left = `${Math.random() * 92 + 4}vw`;
        el.style.animationDuration = `${Math.random() * 4 + 3}s`;
        overlay.appendChild(el);
      }

      // Smoothly fade out entrance overlay after 2.5 seconds
      setTimeout(() => {
        overlay.classList.add('fade-out');
      }, 2500);

      // Create permanent side decorations for Page 1
      for (let i = 0; i < 20; i++) {
        setTimeout(() => {
          const el = document.createElement('div');
          const isBalloon = Math.random() > 0.5;
          el.className = 'decoration ' + (isBalloon ? 'balloon' : 'heart');
          
          if (isBalloon) {
            el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            el.onclick = function() {
              this.classList.add('popped');
              setTimeout(() => this.remove(), 200);
            };
          } else {
            el.textContent = icons[Math.floor(Math.random() * icons.length)];
          }

          // Position strictly on sides (5-20% left or 80-95% right)
          const onLeft = Math.random() > 0.5;
          el.style.left = onLeft ? `${Math.random() * 15 + 4}vw` : `${Math.random() * 15 + 80}vw`;
          el.style.animationDuration = `${Math.random() * 7 + 8}s`;
          
          document.body.appendChild(el);
        }, i * 500);
      }
    }

    window.onload = initBalloonsAndHearts;
  </script>
</body>
</html>
