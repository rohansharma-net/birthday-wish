<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Gauri! ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    :root {
      --bg-color: #fdf0ed;
      --card-bg: rgba(255, 255, 255, 0.95);
      --primary: #ff8fa3;
      --primary-hover: #ff758f;
      --text-main: #4a4e69;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Quicksand', sans-serif; 
      background-color: var(--bg-color); 
      color: var(--text-main); 
      min-height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* ---------------------------------- */
    /* 1. FULLSCREEN SPLASH OVERLAY       */
    /* ---------------------------------- */
    #splashOverlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-color: var(--bg-color);
      z-index: 9999;
      pointer-events: none;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      overflow: hidden;
    }
    #splashOverlay.hide {
      opacity: 0;
      visibility: hidden;
    }

    /* Floating Balloons & Hearts Styles */
    .decoration {
      position: fixed;
      cursor: pointer;
      user-select: none;
      z-index: 1;
      transition: transform 0.15s ease-out, opacity 0.15s ease-out;
      will-change: transform;
    }
    .splash-item {
      z-index: 10000;
    }
    .balloon {
      width: 46px;
      height: 56px;
      background-color: #ffb3c1;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      box-shadow: inset -5px -5px 10px rgba(0,0,0,0.1);
      display: flex;
      justify-content: center;
    }
    .balloon::after {
      content: '';
      position: absolute;
      bottom: -8px;
      width: 2px;
      height: 42px;
      background: rgba(0,0,0,0.15);
    }
    .heart {
      font-size: 2rem;
      filter: drop-shadow(0 4px 6px rgba(255, 143, 163, 0.4));
    }
    .popped {
      transform: scale(2) !important;
      opacity: 0 !important;
    }

    /* Animation Keyframes */
    @keyframes floatUp {
      0% { transform: translateY(110vh) translateX(0) rotate(0deg); opacity: 0.95; }
      50% { transform: translateY(50vh) translateX(var(--sway)) rotate(15deg); }
      100% { transform: translateY(-20vh) translateX(calc(var(--sway) * -1)) rotate(-15deg); opacity: 0.2; }
    }

    /* ---------------------------------- */
    /* 2. MAIN PAGE CARD                  */
    /* ---------------------------------- */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      width: 100%;
      max-width: 480px;
      border-radius: 28px;
      padding: 40px 25px;
      text-align: center;
      box-shadow: 0 16px 45px rgba(255, 143, 163, 0.3);
      z-index: 10;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.8);
      
      /* Hidden initially during splash screen */
      opacity: 0;
      transform: scale(0.88);
      pointer-events: none;
      transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .card.show {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }
    
    h1 { font-family: 'Fredoka', sans-serif; font-size: 2.5rem; color: var(--primary); margin-bottom: 20px; }

    /* Interactive Cake & Wind Effect */
    .cake-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 25px 0 15px 0;
      position: relative;
    }
    .candle {
      width: 12px;
      height: 38px;
      background: #ffebb3;
      border-radius: 4px;
      position: relative;
      z-index: 2;
    }
    .flame {
      width: 16px;
      height: 24px;
      background: #ffb703;
      border-radius: 50% 50% 20% 20%;
      position: absolute;
      top: -26px;
      left: -2px;
      box-shadow: 0 0 15px #ffb703, 0 0 30px #fb8500;
      animation: flicker 1s infinite alternate;
      transition: opacity 0.5s ease-out;
    }
    @keyframes flicker {
      0% { transform: scale(1) rotate(-2deg); opacity: 0.9; }
      100% { transform: scale(1.1) rotate(2deg); opacity: 1; }
    }
    .smoke {
      width: 8px;
      height: 8px;
      background: rgba(180, 180, 180, 0.6);
      border-radius: 50%;
      position: absolute;
      top: -20px; left: 2px;
      opacity: 0;
      pointer-events: none;
    }
    .smoke.active {
      animation: smokeRise 1.5s ease-out forwards;
    }
    @keyframes smokeRise {
      0% { opacity: 0.8; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-30px) scale(2.5); filter: blur(3px); }
    }

    /* Wind Gust Animation */
    .wind-gust {
      position: absolute;
      font-size: 2.2rem;
      pointer-events: none;
      opacity: 0;
      z-index: 20;
    }
    .wind-gust.active {
      animation: windSweep 0.8s ease-out forwards;
    }
    @keyframes windSweep {
      0% { opacity: 0; transform: translateX(-90px) translateY(10px) scale(0.6); }
      50% { opacity: 1; }
      100% { opacity: 0; transform: translateX(90px) translateY(-20px) scale(1.4); }
    }

    .cake-top {
      width: 120px;
      height: 40px;
      background: #ffc2d1;
      border-radius: 10px 10px 0 0;
      margin-top: -5px;
      position: relative;
      z-index: 1;
    }
    .cake-top::after {
      content: ''; position: absolute; bottom: -10px; left: 0; width: 100%; height: 20px;
      background: radial-gradient(circle, #fff 10px, transparent 11px) repeat-x;
      background-size: 20px 20px;
    }
    .cake-bottom {
      width: 140px;
      height: 50px;
      background: #ffe5ec;
      border-radius: 5px;
    }

    /* Blow Candles Button */
    .blow-btn {
      background: #fff0f3;
      color: var(--primary);
      border: 2px solid var(--primary);
      padding: 10px 22px;
      border-radius: 50px;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 15px;
      transition: all 0.3s;
    }
    .blow-btn:hover {
      background: var(--primary);
      color: white;
    }

    /* Countdown */
    .countdown-box { margin-top: 25px; margin-bottom: 25px; }
    .countdown-title { font-size: 0.85rem; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 1.5px; }
    .timer { font-family: 'Fredoka', sans-serif; font-size: 1.5rem; color: var(--text-main); margin-top: 5px; }

    /* Next Page Button */
    .btn {
      background-color: var(--primary); color: white; padding: 14px 28px; border-radius: 50px; text-decoration: none; display: inline-block; transition: 0.3s; border: none; font-family: 'Fredoka', sans-serif; font-size: 1.05rem; box-shadow: 0 4px 15px rgba(255, 143, 163, 0.4);
    }
    .btn:hover { background-color: var(--primary-hover); transform: translateY(-3px); }
  </style>
</head>
<body>

  <!-- Fullscreen Initial Splash Container (Active for first 2.5s) -->
  <div id="splashOverlay"></div>

  <!-- Main Content Card (Page 1) -->
  <div class="card" id="mainCard">
    <h1>Happy Birthday Gauri! ✨</h1>

    <div class="cake-container">
      <div class="wind-gust" id="windGust">💨💨</div>
      <div class="candle">
        <div class="flame" id="flame"></div>
        <div class="smoke" id="smoke"></div>
      </div>
      <div class="cake-top"></div>
      <div class="cake-bottom"></div>
      <button class="blow-btn" id="blowBtn" onclick="blowCandles()">Blow the Candles 💨</button>
    </div>

    <div class="countdown-box">
      <div class="countdown-title">Countdown to Sept 19 🎈</div>
      <div class="timer" id="countdownTimer">Loading...</div>
    </div>

    <a href="page2.html" class="btn">Open Your Gifts! 🎁 ➔</a>
  </div>

  <script>
    const colors = ['#ffb3c1', '#c1d3fe', '#bde0fe', '#ffc2d1', '#fcf6bd', '#ff8fa3', '#e8aeb7', '#cdb4db'];
    const icons = ['💖', '✨', '🌸', '🤍', '⭐', '🎈', '💕', '🎂', '🥳', '💌'];

    // 1. Initial 2.5-second Fullscreen Splash Burst
    function startSplashSequence() {
      const splash = document.getElementById('splashOverlay');
      const card = document.getElementById('mainCard');
      const totalSplashItems = 85; // High density to cover entire screen

      for (let i = 0; i < totalSplashItems; i++) {
        const el = document.createElement('div');
        const isBalloon = Math.random() > 0.45;
        
        el.className = 'decoration splash-item ' + (isBalloon ? 'balloon' : 'heart');

        if (isBalloon) {
          el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        } else {
          el.textContent = icons[Math.floor(Math.random() * icons.length)];
        }

        // Scatter across screen width (1vw to 96vw)
        el.style.left = `${Math.random() * 95 + 1}vw`;
        el.style.setProperty('--sway', `${(Math.random() - 0.5) * 120}px`);

        // Fast floating speed for splash phase
        const speed = Math.random() * 2 + 2; // 2s to 4s
        el.style.animation = `floatUp ${speed}s linear infinite`;
        el.style.animationDelay = `-${Math.random() * speed}s`;

        splash.appendChild(el);
      }

      // Exact 2.5 Seconds Delay before Page 1 reveals
      setTimeout(() => {
        splash.classList.add('hide');
        card.classList.add('show');
        initBackgroundDecorations(); // Start permanent interactive background
      }, 2500);
    }

    // 2. Interactive Background Balloons & Hearts after Page 1 opens
    function initBackgroundDecorations() {
      for (let i = 0; i < 35; i++) {
        const el = document.createElement('div');
        const isBalloon = Math.random() > 0.45;
        
        el.className = 'decoration ' + (isBalloon ? 'balloon' : 'heart');

        if (isBalloon) {
          el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          el.onclick = function(e) {
            e.stopPropagation();
            this.classList.add('popped');
            setTimeout(() => this.remove(), 200);
          };
        } else {
          el.textContent = icons[Math.floor(Math.random() * icons.length)];
        }

        el.style.left = `${Math.random() * 94 + 2}vw`;
        el.style.setProperty('--sway', `${(Math.random() - 0.5) * 80}px`);

        const duration = Math.random() * 4 + 5; // 5s to 9s
        el.style.animation = `floatUp ${duration}s linear infinite`;
        el.style.animationDelay = `-${Math.random() * duration}s`;

        document.body.appendChild(el);
      }
    }

    // 3. Countdown Logic
    function updateCountdown() {
      const now = new Date();
      let targetYear = now.getFullYear();
      let targetDate = new Date(`September 19, ${targetYear} 00:00:00`);
      if (now > targetDate) targetDate = new Date(`September 19, ${targetYear + 1} 00:00:00`);

      const diff = targetDate - now;
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / 1000 / 60) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      const timerElement = document.getElementById('countdownTimer');
      if (diff <= 0) { timerElement.textContent = "🎉 IT'S YOUR BIRTHDAY! 🎉"; } 
      else { timerElement.textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`; }
    }
    setInterval(updateCountdown, 1000); updateCountdown();

    // 4. Windy Candle Blow with Star Confetti Burst
    let isBlown = false;
    function blowCandles() {
      if (isBlown) return;
      isBlown = true;

      const wind = document.getElementById('windGust');
      const flame = document.getElementById('flame');
      const smoke = document.getElementById('smoke');
      const blowBtn = document.getElementById('blowBtn');

      wind.classList.add('active');

      setTimeout(() => {
        flame.style.opacity = '0';
        smoke.classList.add('active');
        blowBtn.textContent = 'Candles Blown! 🌟';
        blowBtn.style.opacity = '0.7';

        const rect = flame.getBoundingClientRect();
        const x = (rect.left + rect.width / 2) / window.innerWidth;
        const y = (rect.top + rect.height / 2) / window.innerHeight;

        confetti({
          particleCount: 130,
          spread: 90,
          origin: { x: x, y: y },
          shapes: ['star'],
          colors: ['#FFD700', '#FFA500', '#FFF', '#FF69B4', '#FFB6C1', '#BDE0FE'],
          scalar: 1.3
        });
      }, 400);
    }

    window.onload = startSplashSequence;
  </script>
</body>
</html>
