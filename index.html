<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Gauri! ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f4efeb; /* Vintage cream background */
      --card-bg: #ffffff;
      --primary: #d4a373; /* Warm aesthetic tone */
      --primary-hover: #bc8a5f;
      --text-main: #4a4e69;
      --shadow: 0 12px 32px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Quicksand', sans-serif; background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    
    .card { background: var(--card-bg); width: 100%; max-width: 520px; border-radius: 20px; padding: 40px 25px; text-align: center; box-shadow: var(--shadow); animation: fadeIn 1s ease-in-out; border: 1px solid #e9e3df; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    .photo-wrapper { position: relative; width: 140px; height: 140px; margin: 0 auto 20px; }
    .photo-wrapper img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 4px solid var(--primary); }
    .floating-badge { position: absolute; bottom: -5px; right: -15px; background: #8f938c; color: white; font-family: 'Fredoka', sans-serif; font-size: 0.85rem; padding: 6px 14px; border-radius: 12px; animation: bounce 2s infinite; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    
    h1 { font-family: 'Fredoka', sans-serif; font-size: 2.4rem; color: var(--primary); margin-bottom: 8px; }
    
    .countdown-box { background: #faf8f6; border: 2px dashed var(--primary); border-radius: 16px; padding: 15px; margin: 25px 0; }
    .timer { font-family: 'Fredoka', sans-serif; font-size: 1.5rem; margin-top: 5px; color: #6b705c; }
    
    .btn { background-color: var(--primary); color: white; font-family: 'Fredoka', sans-serif; font-size: 1.1rem; padding: 14px 28px; border-radius: 50px; text-decoration: none; display: inline-block; transition: all 0.3s; margin-top: 10px; border: none; box-shadow: 0 4px 15px rgba(212, 163, 115, 0.4); }
    .btn:hover { background-color: var(--primary-hover); transform: translateY(-3px); }
  </style>
</head>
<body>
  <div class="card">
    <div class="photo-wrapper">
      <img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?w=400" alt="Birthday Person">
      <div class="floating-badge">🎂 Sept 19</div>
    </div>
    <h1>Happy Birthday Gauri! ✨</h1>
    <p>Counting down to your special day...</p>

    <div class="countdown-box">
      <div style="font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Countdown to Sept 19</div>
      <div class="timer" id="countdownTimer">Loading...</div>
    </div>

    <!-- Links directly to Page 2 -->
    <a href="page2.html" class="btn">Start the Journey! 🚀 ➔</a>
  </div>

  <script>
    function updateCountdown() {
      const now = new Date();
      let targetYear = now.getFullYear();
      let targetDate = new Date(`September 19, ${targetYear} 00:00:00`);
      if (now > targetDate) targetDate = new Date(`September 19, ${targetYear + 1} 00:00:00`);

      const diff = targetDate - now;
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / 1000 / 60) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      const timerElement = document.getElementById('countdownTimer');
      if (diff <= 0) { timerElement.textContent = "🎉 IT'S YOUR BIRTHDAY! 🎉"; } 
      else { timerElement.textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`; }
    }
    setInterval(updateCountdown, 1000); updateCountdown();
  </script>
</body>
</html>
